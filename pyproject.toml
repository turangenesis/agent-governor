[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-governor"
version = "0.1.0"
description = "The Governor - a reusable oversight & eval layer for autonomous agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Emre Turan" }]
keywords = ["ai-agents", "ai-safety", "evaluation", "oversight", "human-in-the-loop"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core install is deliberately light so `pip install -e .` stays offline-friendly:
# the deterministic core (governor scoring, eval labels, CLI) needs no third-party
# packages, and live discovery only needs requests. The heavy agent/UI stack lives
# under the optional `demo` extra.
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# The full runnable demo: Streamlit UI + LangGraph/Bedrock agent stack.
demo = [
    "streamlit>=1.36.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-aws>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "boto3>=1.34.0",
]
test = [
    "pytest>=8.0",
]
# Named eval framework (Phase 2 of docs/EVAL.md): the Governor's decisions and the draft-quality
# judge run as DeepEval metrics, pytest-native and CI-gated. Used offline as the harness only.
eval = [
    "deepeval>=4.0",
]
# Optional HTTP service (governor.api): consume the layer over HTTP, not just as a library.
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/turangenesis/agent-governor"
Repository = "https://github.com/turangenesis/agent-governor"
Demo = "https://turangenesis.github.io/agent-governor/"

[project.scripts]
governor = "governor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
