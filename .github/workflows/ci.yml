name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (editable, with the demo + test + eval + api extras)
        run: pip install -e ".[demo,test,eval,api]"
      - name: Run the test suite (incl. the DeepEval-gated evals)
        env:
          DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
          DEEPEVAL_UPDATE_WARNING_OPT_OUT: "YES"
        run: pytest -q
